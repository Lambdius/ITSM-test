name: CI Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: make install
      - run: make env-check tsc lint knip
      - run: make compile

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: make install
      - run: make coverage

  build:
    runs-on: ubuntu-latest
    needs: [static-analysis, integration]
    steps:
      - uses: actions/checkout@v4
      - run: make env build
